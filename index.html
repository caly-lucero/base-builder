<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a120b" />
    <meta name="description" content="Prototipo de juego de estrategia con construcción de base. Un jugador, funciona sin conexión." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Base Builder</title>
  </head>
  <body>
    <main>
      <div id="game"></div>
      <footer>
        <div class="actions">
          <button type="button" id="btn-sound" aria-pressed="true">Sonido: sí</button>
          <button type="button" id="btn-export">Exportar partida</button>
          <button type="button" id="btn-import">Importar partida</button>
          <button type="button" id="btn-reset" class="danger">Nueva partida</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
        <input type="file" id="file-import" accept="application/json,.json" hidden />
      </footer>
    </main>
    <noscript>Este juego necesita JavaScript.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
